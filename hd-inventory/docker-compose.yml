
services:
  # ─── Base de Datos PostgreSQL ───────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: hdinventory_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis para Channels ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hdinventory_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend Django ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hdinventory_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=db
    volumes:
      - ./backend:/app
      - ./media:/app/media
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             uvicorn core_main_hdinventory.asgi:application --host 0.0.0.0 --port 8000"

  # ─── Frontend React (Development Server) ────────────────────
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hdinventory_frontend_dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started

  # ─── Servidor Web NGINX (Proxy Inverso + Frontend Prod) ─────
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: hdinventory_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      backend:
        condition: service_started



volumes:
  pgdata:
    name: hdinventory_pgdata
  static_volume:
    name: hdinventory_static_volume
