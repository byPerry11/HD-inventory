
services:
  # ─── Base de Datos PostgreSQL ───────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: hdinventory_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis para Channels ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hdinventory_redis
    restart: unless-stopped
    command: sh -c "redis-server --requirepass $${REDIS_PASSWORD:-hdredis2026}"
    env_file:
      - .env
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend Django ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hdinventory_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    volumes:
      - ./media:/app/media
      - static_volume:/app/staticfiles
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5
    # Arranque vía ENTRYPOINT de la imagen (collectstatic + migrate + uvicorn
    # como appuser tras fijar permisos de volúmenes).

  # ─── Frontend React (Development Server) ────────────────────
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hdinventory_frontend_dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5173:5173"
    profiles:
      - dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started

  # ─── Servidor Web NGINX (Proxy Inverso + Frontend Prod) ─────
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: hdinventory_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      backend:
        condition: service_started



volumes:
  pgdata:
    name: hdinventory_pgdata
  redisdata:
    name: hdinventory_redisdata
  static_volume:
    name: hdinventory_static_volume
